<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>A Feijoa on Monday — a tap-along storybook</title>
<meta name="description" content="A tap-along picture book for little readers, from a windy Wellington garden.">
<meta name="theme-color" content="#1b2a5e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/img/icon-192.png">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <!-- Fixed-ratio stage, letterboxed on non-matching screens -->
  <div id="stage" aria-label="storybook stage">

    <!-- The scene world: camera zoom is applied here -->
    <div id="world">
      <img id="scene-night" class="scene" src="assets/img/scene-night.jpg" alt="A night garden with hills, a smiling moon and a big leaf">
      <img id="scene-day"   class="scene" src="assets/img/scene-day.jpg"   alt="A sunny garden with hills, a fantail and a big leaf">
      <div id="atmosphere"></div>
      <div id="sprites"></div>
      <div id="fx"></div>
    </div>

    <!-- Non-zooming stage chrome -->
    <div id="vignette"></div>
    <div id="caption" class="hidden"><p id="caption-text"></p></div>

    <button id="arrow-btn" class="hidden" aria-label="Next page" disabled>
      <img src="assets/img/arrow.png" alt="">
    </button>

    <!-- Splash -->
    <div id="splash">
      <img id="splash-art" src="assets/img/scene-title.jpg" alt="A Feijoa on Monday — a caterpillar under kōwhai flowers">
      <div id="splash-ui">
        <p id="splash-subtitle">a tap-along story from a windy Wellington garden</p>
        <button id="begin-btn">Tap to begin</button>
      </div>
    </div>

    <div id="turner"></div>
  </div>
</div>

<script src="js/audio.js"></script>
<script src="js/story.js"></script>
<script src="js/app.js"></script>
</body>
</html>
