<style>
/* ============================================================
   A Feijoa on Monday — storybook styles
   Scene art is 1316 × 924 (ratio 1.4242). Stage keeps that ratio.
   ============================================================ */

:root {
  --stage-ratio: 1316 / 924;
  --ink: #23315f;
  --night: #101c44;
  --paper: #fffdf4;
  --sun: #f6c945;
  --leaf: #4f9e3c;
  --caption-h: 15.5%;
  --font-display: "Baloo 2", "Comic Sans MS", "Marker Felt", cursive;
  --font-story: "Patrick Hand", "Comic Sans MS", "Marker Felt", cursive;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--night);
  font-family: var(--font-display);
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background:
    radial-gradient(120% 90% at 50% 10%, #223267 0%, var(--night) 55%, #0a1230 100%);
}

/* ---------- Stage (fixed ratio, letterboxed) ---------- */
#stage {
  position: relative;
  width: min(100vw, calc(100vh * var(--stage-ratio)));
  aspect-ratio: var(--stage-ratio);
  overflow: hidden;
  border-radius: clamp(8px, 1.5vmin, 18px);
  box-shadow: 0 12px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  background: var(--night);
}

/* ---------- World & camera ---------- */
#world {
  position: absolute; inset: 0;
  transition: transform 1.6s cubic-bezier(.4,.1,.2,1);
  will-change: transform;
}

.scene {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  transition: opacity 2.2s ease;
  pointer-events: none;
}
#scene-day { opacity: 0; }

#atmosphere, #sprites, #fx { position: absolute; inset: 0; }
#fx { pointer-events: none; }

/* ---------- Sprites ---------- */
.sprite {
  position: absolute;
  transform-origin: 50% 85%;
}
.sprite img { width: 100%; height: 100%; display: block; pointer-events: none; }

.tappable { cursor: pointer; }

.hotspot {
  position: absolute;
  border-radius: 50%;
  cursor: pointer;
  /* invisible but tappable */
  background: transparent;
}

/* ---------- Object animations ---------- */
@keyframes wobble-sm {
  0%,100% { transform: rotate(0deg); }
  20% { transform: rotate(-6deg); }
  45% { transform: rotate(5deg); }
  70% { transform: rotate(-3deg); }
  88% { transform: rotate(2deg); }
}
@keyframes wobble-lg {
  0%,100% { transform: rotate(0deg) translateY(0); }
  15% { transform: rotate(-12deg) translateY(-1.5%); }
  35% { transform: rotate(11deg); }
  55% { transform: rotate(-9deg) translateY(-1%); }
  75% { transform: rotate(6deg); }
  90% { transform: rotate(-3deg); }
}
.anim-wobble-sm { animation: wobble-sm .7s ease-in-out; }
.anim-wobble-lg { animation: wobble-lg .8s ease-in-out; }

@keyframes crack-out {
  0%   { transform: scale(1) rotate(0); opacity: 1; }
  30%  { transform: scale(1.18) rotate(-7deg); opacity: 1; }
  100% { transform: scale(.1) rotate(25deg); opacity: 0; }
}
.anim-crack { animation: crack-out .55s ease-in forwards; }

@keyframes hatch-in {
  0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
  55%  { transform: scale(1.25) rotate(6deg); opacity: 1; }
  75%  { transform: scale(.92) rotate(-3deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
.anim-hatch { animation: hatch-in .9s cubic-bezier(.34,1.56,.64,1) forwards; }

@keyframes hint-wiggle {
  0%,100% { transform: scale(1) rotate(0); }
  25% { transform: scale(1.06) rotate(-3deg); }
  50% { transform: scale(1.03) rotate(3deg); }
  75% { transform: scale(1.05) rotate(-2deg); }
}
.anim-hint { animation: hint-wiggle .9s ease-in-out 2; }

@keyframes idle-breathe {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-.6%); }
}
.anim-breathe { animation: idle-breathe 3.2s ease-in-out infinite; }

/* ---------- Moon / sun glow pulse ---------- */
.glow-pulse {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255,244,180,.85) 0%, rgba(255,244,180,.28) 45%, transparent 70%);
  animation: glow-pop 1.4s ease-out forwards;
  mix-blend-mode: screen;
}
@keyframes glow-pop {
  0% { transform: scale(.4); opacity: 0; }
  25% { opacity: 1; }
  100% { transform: scale(1.6); opacity: 0; }
}

/* Permanent soft sun glow on day scene */
.sun-glow {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255,232,140,.55) 0%, rgba(255,232,140,.22) 45%, transparent 72%);
  mix-blend-mode: screen;
  animation: sun-breathe 5s ease-in-out infinite;
}
@keyframes sun-breathe {
  0%,100% { transform: scale(1); opacity: .8; }
  50% { transform: scale(1.12); opacity: 1; }
}
.sun-rays {
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
  background: repeating-conic-gradient(
    rgba(255,225,120,.16) 0deg 6deg,
    transparent 6deg 18deg);
  -webkit-mask-image: radial-gradient(circle, transparent 22%, #000 34%, transparent 70%);
  mask-image: radial-gradient(circle, transparent 22%, #000 34%, transparent 70%);
  animation: rays-spin 40s linear infinite;
  mix-blend-mode: screen;
}
@keyframes rays-spin { to { transform: rotate(360deg); } }

/* ---------- Night atmosphere ---------- */
.twinkle {
  position: absolute;
  width: .55%; aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, #fffbe0 0%, rgba(255,251,224,.35) 55%, transparent 75%);
  animation: twinkle 2.6s ease-in-out infinite;
  pointer-events: none;
}
@keyframes twinkle {
  0%,100% { opacity: .12; transform: scale(.7); }
  50% { opacity: .95; transform: scale(1.25); }
}
.firefly {
  position: absolute;
  width: .8%; aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, #ffe98a 0%, rgba(255,233,138,.4) 50%, transparent 75%);
  filter: blur(.5px);
  animation: drift 11s ease-in-out infinite alternate, ffglow 2.1s ease-in-out infinite;
  pointer-events: none;
}
@keyframes drift {
  0%   { transform: translate(0,0); }
  30%  { transform: translate(4vw, -2.5vh); }
  60%  { transform: translate(-2.5vw, -5vh); }
  100% { transform: translate(3vw, 1.5vh); }
}
@keyframes ffglow { 0%,100% { opacity: .15; } 50% { opacity: .9; } }

/* ---------- Day clouds ---------- */
.cloud {
  position: absolute;
  pointer-events: none;
  animation: cloud-drift linear infinite;
  opacity: .9;
}
@keyframes cloud-drift {
  from { transform: translateX(-30%); }
  to   { transform: translateX(160vw); }
}

/* ---------- Sparkles ---------- */
.spark {
  position: absolute;
  width: 12px; height: 12px;
  pointer-events: none;
  background: currentColor;
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  animation: spark-fly .8s cubic-bezier(.2,.7,.4,1) forwards;
}
@keyframes spark-fly {
  0%   { transform: translate(0,0) scale(1) rotate(0); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(.1) rotate(160deg); opacity: 0; }
}

/* ---------- Vignette ---------- */
#vignette {
  position: absolute; inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 12vmin 2vmin rgba(20, 25, 60, .38);
  border-radius: inherit;
}

/* ---------- Caption bar ---------- */
#caption {
  position: absolute;
  left: 3.5%; right: 3.5%; bottom: 3%;
  min-height: var(--caption-h);
  display: flex; align-items: center; justify-content: center;
  padding: 1.2% 9% 1.2% 3%;
  background: linear-gradient(180deg, rgba(255,253,244,.96), rgba(250,244,220,.96));
  border: 3px solid rgba(35,49,95,.85);
  border-radius: 22px;
  box-shadow: 0 6px 18px rgba(10,15,40,.35);
  transition: opacity .5s ease, transform .5s ease;
}
#caption.hidden { opacity: 0; transform: translateY(30%); pointer-events: none; }
#caption-text {
  font-family: var(--font-story);
  font-size: clamp(15px, 3.4vmin, 34px);
  line-height: 1.32;
  color: var(--ink);
  text-align: center;
}
#caption-text .w {
  transition: color .18s ease, background .18s ease;
  border-radius: 6px;
  padding: 0 .08em;
}
#caption-text .w.lit {
  color: #a33c00;
  background: rgba(246, 201, 69, .55);
}

/* ---------- Arrow button ---------- */
#arrow-btn {
  position: absolute;
  right: 2.2%; bottom: 4.2%;
  width: 8.5%;
  aspect-ratio: 81 / 95;
  border: none; background: none; padding: 0;
  cursor: pointer;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,.35));
  transition: opacity .5s ease, transform .25s ease;
  z-index: 6;
}
#arrow-btn img { width: 100%; height: 100%; }
#arrow-btn:disabled { opacity: .25; cursor: default; filter: grayscale(.7); }
#arrow-btn:not(:disabled) { animation: arrow-beckon 1.6s ease-in-out infinite; }
#arrow-btn:not(:disabled):active { transform: scale(.88); }
@keyframes arrow-beckon {
  0%,100% { transform: translateX(0) scale(1); }
  50% { transform: translateX(6%) scale(1.07); }
}
#arrow-btn.hidden { display: none; }

/* ---------- Splash ---------- */
#splash {
  position: absolute; inset: 0;
  z-index: 10;
  transition: opacity .8s ease, transform .8s ease;
}
#splash.gone { opacity: 0; transform: scale(1.06); pointer-events: none; }
#splash-art { width: 100%; height: 100%; object-fit: cover; display: block; }
#splash-ui {
  position: absolute; left: 42%; right: 3%; bottom: 6%;
  display: flex; flex-direction: column; align-items: center; gap: 2.2vmin;
}
#splash-subtitle {
  font-family: var(--font-story);
  font-size: clamp(14px, 3.1vmin, 30px);
  color: #7a4a12;
  background: rgba(255,253,244,.85);
  padding: .3em 1em;
  border-radius: 999px;
  border: 2px solid rgba(122,74,18,.35);
  transform: rotate(-1.2deg);
}
#begin-btn {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(18px, 4.2vmin, 42px);
  color: #fffdf4;
  background: linear-gradient(180deg, #58c928, #3d9d17);
  border: 4px solid #2c720f;
  border-radius: 999px;
  padding: .35em 1.3em;
  cursor: pointer;
  box-shadow: 0 8px 0 #245c0c, 0 14px 24px rgba(0,0,0,.35);
  animation: begin-bounce 1.8s ease-in-out infinite;
}
#begin-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #245c0c; }
@keyframes begin-bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6%); }
}

/* ---------- Page turn ---------- */
#turner {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 8;
  opacity: 0;
  background: linear-gradient(105deg,
    transparent 30%,
    rgba(255,253,244,.25) 45%,
    rgba(255,253,244,.95) 50%,
    rgba(230,222,196,.95) 55%,
    rgba(255,253,244,.2) 66%,
    transparent 78%);
  background-size: 260% 100%;
  background-position: 130% 0;
}
#turner.turning {
  animation: page-sweep .85s cubic-bezier(.5,.05,.35,1) forwards;
}
@keyframes page-sweep {
  0%   { opacity: 0; background-position: 130% 0; }
  15%  { opacity: 1; }
  85%  { opacity: 1; }
  100% { opacity: 0; background-position: -60% 0; }
}
.world-out { animation: world-out .45s ease-in forwards; }
@keyframes world-out {
  to { opacity: 0; transform: scale(1.03) translateX(-2%); }
}
.world-in { animation: world-in .6s ease-out; }
@keyframes world-in {
  from { opacity: 0; transform: scale(.985) translateX(2%); }
  to   { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important; }
}

</style>
</head>

<script>
/* ============================================================
   audio.js — synthesized sound effects (no audio files needed)
   All sounds are built from oscillators + filtered noise.
   ============================================================ */

const Sfx = (() => {
  let ctx = null;
  let master = null;

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.55;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function env(gainNode, t0, attack, peak, decay) {
    const g = gainNode.gain;
    g.setValueAtTime(0.0001, t0);
    g.exponentialRampToValueAtTime(peak, t0 + attack);
    g.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  }

  function osc(type, freq, t0, dur, peak = 0.4, freqEnd = null, dest = null) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (freqEnd !== null) o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
    env(g, t0, 0.008, peak, dur);
    o.connect(g).connect(dest || master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  function noiseBurst(t0, dur, peak = 0.3, filterFreq = 2000, type = 'bandpass') {
    const len = Math.ceil(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = type; f.frequency.value = filterFreq; f.Q.value = 0.8;
    const g = ctx.createGain();
    env(g, t0, 0.005, peak, dur);
    src.connect(f).connect(g).connect(master);
    src.start(t0); src.stop(t0 + dur + 0.05);
  }

  /* -------- public sounds -------- */

  // soft ui tap
  function tap() {
    if (!ensure()) return;
    const t = ctx.currentTime;
    osc('sine', 660, t, 0.09, 0.25, 520);
  }

  // sparkle burst chime
  function sparkle() {
    if (!ensure()) return;
    const t = ctx.currentTime;
    [1240, 1660, 2090, 2480].forEach((f, i) =>
      osc('sine', f, t + i * 0.045, 0.22, 0.12, f * 1.15));
  }

  // egg wobble — rubbery low warble
  function wobble(intensity = 1) {
    if (!ensure()) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    const lfo = ctx.createOscillator();
    const lfoG = ctx.createGain();
    o.type = 'triangle';
    o.frequency.value = 150 + 40 * intensity;
    lfo.type = 'sine'; lfo.frequency.value = 9 + 3 * intensity;
    lfoG.gain.value = 32 * intensity;
    lfo.connect(lfoG).connect(o.frequency);
    env(g, t, 0.015, 0.3, 0.5);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.6);
    lfo.start(t); lfo.stop(t + 0.6);
  }

  // POP! crack — noise snap + pitch drop
  function crackPop() {
    if (!ensure()) return;
    const t = ctx.currentTime;
    noiseBurst(t, 0.09, 0.5, 3400, 'highpass');
    osc('square', 520, t + 0.01, 0.12, 0.28, 90);
    osc('sine', 900, t + 0.02, 0.3, 0.3, 180);
    noiseBurst(t + 0.06, 0.25, 0.14, 900, 'bandpass');
  }

  // springy bounce for the hatch landing
  function boing() {
    if (!ensure()) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(360, t);
    o.frequency.exponentialRampToValueAtTime(140, t + 0.12);
    o.frequency.exponentialRampToValueAtTime(300, t + 0.24);
    o.frequency.exponentialRampToValueAtTime(180, t + 0.38);
    env(g, t, 0.01, 0.35, 0.5);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.55);
  }

  // moon / sun shimmer — soft rising glissando cluster
  function shimmer() {
    if (!ensure()) return;
    const t = ctx.currentTime;
    [523, 659, 784, 1046, 1318].forEach((f, i) =>
      osc('sine', f, t + i * 0.07, 0.6, 0.09, f * 1.06));
    noiseBurst(t, 0.7, 0.05, 6000, 'highpass');
  }

  // page turn whoosh
  function whoosh() {
    if (!ensure()) return;
    const t = ctx.currentTime;
    const len = Math.ceil(ctx.sampleRate * 0.6);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(300, t);
    f.frequency.exponentialRampToValueAtTime(2400, t + 0.3);
    f.frequency.exponentialRampToValueAtTime(400, t + 0.6);
    const g = ctx.createGain();
    env(g, t, 0.08, 0.32, 0.52);
    src.connect(f).connect(g).connect(master);
    src.start(t); src.stop(t + 0.7);
  }

  // arrow-ready ding
  function chime() {
    if (!ensure()) return;
    const t = ctx.currentTime;
    osc('sine', 880, t, 0.5, 0.16, 880);
    osc('sine', 1318, t + 0.09, 0.55, 0.12, 1318);
  }

  // munch (ready for the eating pages)
  function munch() {
    if (!ensure()) return;
    const t = ctx.currentTime;
    noiseBurst(t, 0.07, 0.4, 1200, 'bandpass');
    noiseBurst(t + 0.11, 0.07, 0.35, 900, 'bandpass');
    osc('triangle', 200, t, 0.08, 0.2, 120);
  }

  // unlock/resume on first user gesture
  function unlock() { ensure(); }

  return { tap, sparkle, wobble, crackPop, boing, shimmer, whoosh, chime, munch, unlock };
})();

/* ============================================================
   app.js — storybook engine
   Renders pages from STORY, handles taps, narration
   highlighting, camera, atmosphere and page turns.
   ============================================================ */

(() => {
  const $ = (sel) => document.querySelector(sel);

  const world     = $('#world');
  const sprites   = $('#sprites');
  const atmo      = $('#atmosphere');
  const fx        = $('#fx');
  const nightImg  = $('#scene-night');
  const dayImg    = $('#scene-day');
  const caption   = $('#caption');
  const capText   = $('#caption-text');
  const arrowBtn  = $('#arrow-btn');
  const splash    = $('#splash');
  const beginBtn  = $('#begin-btn');
  const turner    = $('#turner');
  const stage     = $('#stage');

  let pageIndex = -1;          // -1 = splash
  let narrTimer = null;
  let idleTimer = null;
  let pendingTappables = [];   // sprites that still want attention (for hints)
  let arrowArmed = false;

  /* ================= Scene & atmosphere ================= */

  function showScene(name, crossfade) {
    if (name === 'day') {
      if (crossfade) {
        nightImg.style.opacity = 1;
        dayImg.style.opacity = 0;
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            nightImg.style.opacity = 0;
            dayImg.style.opacity = 1;
          }));
      } else {
        nightImg.style.opacity = 0;
        dayImg.style.opacity = 1;
      }
    } else {
      nightImg.style.opacity = 1;
      dayImg.style.opacity = 0;
    }
  }

  function buildAtmosphere(scene) {
    atmo.innerHTML = '';
    if (scene === 'night') {
      // twinkling stars (kept in the sky band)
      for (let i = 0; i < 26; i++) {
        const s = document.createElement('div');
        s.className = 'twinkle';
        s.style.left = (Math.random() * 96 + 2) + '%';
        s.style.top  = (Math.random() * 34 + 2) + '%';
        s.style.animationDelay = (Math.random() * 2.6) + 's';
        s.style.animationDuration = (2 + Math.random() * 2.4) + 's';
        atmo.appendChild(s);
      }
      // fireflies drifting low over the leaf
      for (let i = 0; i < 6; i++) {
        const f = document.createElement('div');
        f.className = 'firefly';
        f.style.left = (Math.random() * 80 + 8) + '%';
        f.style.top  = (Math.random() * 30 + 58) + '%';
        f.style.animationDelay = (Math.random() * 6) + 's, ' + (Math.random() * 2.1) + 's';
        f.style.animationDuration = (9 + Math.random() * 6) + 's, ' + (1.6 + Math.random() * 1.2) + 's';
        atmo.appendChild(f);
      }
    } else {
      // sun glow + slowly rotating rays centred on the drawn sun
      const cx = 50.8, cy = 23.6;             // sun centre (% of scene)
      const glow = document.createElement('div');
      glow.className = 'sun-glow';
      glow.style.width = '34%';
      glow.style.aspectRatio = '1';
      glow.style.left = (cx - 17) + '%';
      glow.style.top  = (cy - 17 * (1316 / 924)) * 1 + '%';
      // aspect-ratio keeps it circular relative to width; nudge with translate
      glow.style.transform = 'translateY(-6%)';
      atmo.appendChild(glow);

      const rays = document.createElement('div');
      rays.className = 'sun-rays';
      rays.style.width = '52%';
      rays.style.aspectRatio = '1';
      rays.style.left = (cx - 26) + '%';
      rays.style.top  = (cy - 26 * (1316 / 924)) + '%';
      atmo.appendChild(rays);

      // drifting clouds — simple flat SVG blobs in the book's style
      const cloudSvg = (w) => `
        <svg viewBox="0 0 220 90" width="${w}" xmlns="http://www.w3.org/2000/svg">
          <g fill="#ffffff" stroke="#23315f" stroke-width="4" stroke-linejoin="round" opacity="0.92">
            <ellipse cx="60" cy="58" rx="52" ry="26"/>
            <ellipse cx="120" cy="44" rx="46" ry="30"/>
            <ellipse cx="168" cy="60" rx="44" ry="22"/>
          </g>
        </svg>`;
      [[2, '10%', 130, 70], [30, '4%', 170, 95], [58, '15%', 110, 120]]
        .forEach(([left, top, w, dur], i) => {
          const c = document.createElement('div');
          c.className = 'cloud';
          c.style.left = left + '%';
          c.style.top = top;
          c.style.animationDuration = dur + 's';
          c.style.animationDelay = (-i * 22) + 's';
          c.innerHTML = cloudSvg(w);
          atmo.appendChild(c);
        });
    }
  }

  /* ================= Camera ================= */

  function setCamera(cam, instant) {
    if (instant) world.style.transition = 'none';
    world.style.transformOrigin = cam ? cam.origin : '50% 50%';
    world.style.transform = cam ? `scale(${cam.scale})` : 'none';
    if (instant) requestAnimationFrame(() => { world.style.transition = ''; });
  }

  /* ================= Sparkles ================= */

  function sparkleBurst(clientX, clientY, color) {
    const rect = stage.getBoundingClientRect();
    const x = clientX - rect.left, y = clientY - rect.top;
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.color = color || '#ffe98a';
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      const ang = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * 70;
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist - 20 + 'px');
      s.style.width = s.style.height = (7 + Math.random() * 9) + 'px';
      s.style.animationDelay = (Math.random() * 0.08) + 's';
      stage.appendChild(s);
      setTimeout(() => s.remove(), 1000);
    }
    Sfx.sparkle();
  }

  /* ============ Narration: read-aloud + synced highlighting ============ */

  let fallbackTimer = null;
  let safetyTimer = null;
  let speechUtterance = null;
  let chosenVoice = null;
  let lastNarration = null;      // for tap-to-replay on the caption

  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;
    const vs = speechSynthesis.getVoices();
    if (!vs.length) return null;
    const prefs = ['en-nz', 'en-gb', 'en-au', 'en-us', 'en'];
    for (const p of prefs) {
      const norm = (v) => v.lang.toLowerCase().replace('_', '-');
      const local = vs.find(v => norm(v).startsWith(p) && v.localService);
      if (local) return local;
      const any = vs.find(v => norm(v).startsWith(p));
      if (any) return any;
    }
    return vs[0];
  }
  if ('speechSynthesis' in window) {
    chosenVoice = pickVoice();
    speechSynthesis.onvoiceschanged = () => { chosenVoice = pickVoice(); };
  }

  function stopNarration() {
    clearInterval(narrTimer);   narrTimer = null;
    clearTimeout(fallbackTimer); fallbackTimer = null;
    clearTimeout(safetyTimer);   safetyTimer = null;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    speechUtterance = null;
  }

  function narrate(text, done) {
    stopNarration();
    lastNarration = { text, done };
    caption.classList.remove('hidden');

    // word spans + each word's character offset within `text`
    const tokens = text.split(/\s+/);
    capText.innerHTML = tokens.map(w => `<span class="w">${w}</span>`).join(' ');
    const words = [...capText.querySelectorAll('.w')];
    const starts = [];
    let pos = 0;
    tokens.forEach(t => {
      const idx = text.indexOf(t, pos);
      starts.push(idx);
      pos = idx + t.length;
    });

    const isWordy = (el) => /[\p{L}\p{N}]/u.test(el.textContent);
    const light = (i) => {
      words.forEach(w => w.classList.remove('lit'));
      if (i >= 0 && i < words.length) words[i].classList.add('lit');
    };
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      stopNarration();
      words.forEach(w => w.classList.remove('lit'));
      if (done) done();
    };

    // timed highlighting — the fallback, and the pacer when the voice
    // plays but the browser gives no word-boundary events
    const startTimedHighlight = (finishWhenDone) => {
      clearInterval(narrTimer);
      let i = 0;
      narrTimer = setInterval(() => {
        while (i < words.length && !isWordy(words[i])) i++;
        if (i >= words.length) {
          clearInterval(narrTimer);
          if (finishWhenDone) finish();
          return;
        }
        light(i); i++;
      }, 330);
    };

    // MP3 hook: drop files at assets/audio/<pageId>.mp3 and, when present,
    // play them here with startTimedHighlight(false) + finish() on 'ended'.

    if (!('speechSynthesis' in window)) { startTimedHighlight(true); return; }

    const u = new SpeechSynthesisUtterance(text);
    speechUtterance = u;
    if (!chosenVoice) chosenVoice = pickVoice();
    if (chosenVoice) { u.voice = chosenVoice; u.lang = chosenVoice.lang; }
    u.rate = 0.88;    // gentle storytime pace
    u.pitch = 1.05;

    let sawBoundary = false;
    u.onboundary = (e) => {
      if (e.name && e.name !== 'word') return;
      sawBoundary = true;
      clearInterval(narrTimer);          // real boundaries beat the pacer
      let i = starts.findIndex((s, k) =>
        e.charIndex >= s && e.charIndex < s + tokens[k].length + 1);
      if (i === -1) i = starts.filter(s => s <= e.charIndex).length - 1;
      if (i >= 0 && isWordy(words[i])) light(i);
    };
    u.onend = () => { if (speechUtterance === u) finish(); };
    u.onerror = () => { if (speechUtterance === u) startTimedHighlight(true); };

    speechSynthesis.cancel();            // clear any stuck queue (Chrome quirk)
    try {
      speechSynthesis.speak(u);
    } catch (err) {
      startTimedHighlight(true);
      return;
    }

    // watchdog: no boundary events after 1.1s → pace highlights on a timer;
    // if the voice never actually started, the timer also ends the page
    fallbackTimer = setTimeout(() => {
      if (!sawBoundary && !finished) {
        const speaking = speechSynthesis.speaking || speechSynthesis.pending;
        startTimedHighlight(!speaking);
      }
    }, 1100);

    // absolute safety net so the arrow can never get stuck
    safetyTimer = setTimeout(finish, tokens.length * 600 + 6000);
  }

  // tap the caption to hear the page again
  caption.addEventListener('pointerdown', () => {
    if (lastNarration) narrate(lastNarration.text, lastNarration.done);
  });

  /* ================= Arrow ================= */

  function disarmArrow() {
    arrowArmed = false;
    arrowBtn.disabled = true;
    arrowBtn.classList.remove('hidden');
  }
  function armArrow() {
    if (arrowArmed) return;
    arrowArmed = true;
    arrowBtn.disabled = false;
    Sfx.chime();
  }

  /* ================= Idle hints ================= */

  function resetIdleHint() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      pendingTappables.forEach(el => {
        el.classList.remove('anim-hint');
        void el.offsetWidth;
        el.classList.add('anim-hint');
      });
      resetIdleHint();
    }, 5000);
  }

  /* ================= Page rendering ================= */

  function makeSprite(obj) {
    const el = document.createElement('div');
    el.className = 'sprite';
    el.id = 'obj-' + obj.id;
    Object.assign(el.style, obj.rect);
    const img = document.createElement('img');
    img.src = obj.img;
    img.alt = '';
    el.appendChild(img);
    if (obj.hiddenAtStart) el.style.opacity = 0;
    if (obj.breathe && !obj.hiddenAtStart) el.classList.add('anim-breathe');
    return el;
  }

  function playAnim(el, cls, after) {
    el.classList.remove('anim-wobble-sm', 'anim-wobble-lg', 'anim-crack', 'anim-hatch', 'anim-hint');
    void el.offsetWidth;
    el.classList.add(cls);
    if (after) el.addEventListener('animationend', after, { once: true });
  }

  function glowAt(rectStyles) {
    const g = document.createElement('div');
    g.className = 'glow-pulse';
    // centre a square glow over the hotspot rect, 1.8× its width
    const l = parseFloat(rectStyles.left), t = parseFloat(rectStyles.top);
    const w = parseFloat(rectStyles.width), h = parseFloat(rectStyles.height);
    const gw = w * 1.9;
    g.style.width = gw + '%';
    g.style.aspectRatio = '1';
    g.style.left = (l + w / 2 - gw / 2) + '%';
    g.style.top = (t + h / 2 - gw / 2 * (1316 / 924)) + '%';
    fx.appendChild(g);
    setTimeout(() => g.remove(), 1500);
  }

  function loadPage(idx) {
    const page = STORY.pages[idx];
    pageIndex = idx;
    pendingTappables = [];
    sprites.innerHTML = '';
    fx.innerHTML = '';
    disarmArrow();

    showScene(page.scene, !!page.crossfadeFrom);
    buildAtmosphere(page.scene);
    setCamera(page.camera, true);

    /* ---- objects ---- */
    const els = {};
    (page.objects || []).forEach(obj => {
      const el = makeSprite(obj);
      els[obj.id] = { el, obj };
      sprites.appendChild(el);
    });

    /* ---- generic taps ---- */
    (page.objects || []).forEach(obj => {
      const { el } = els[obj.id];
      if (!obj.tap) return;
      el.classList.add('tappable');
      if (obj.tap.effect !== 'hatch') pendingTappables.push(el);

      if (obj.tap.effect === 'wobble') {
        el.addEventListener('pointerdown', (e) => {
          playAnim(el, 'anim-wobble-sm');
          Sfx.wobble(1);
          sparkleBurst(e.clientX, e.clientY, obj.tap.sparkColor);
          pendingTappables = pendingTappables.filter(p => p !== el);
          resetIdleHint();
        });
      }

      if (obj.tap.effect === 'hatch') {
        let taps = 0;
        pendingTappables.push(el);
        el.addEventListener('pointerdown', (e) => {
          if (taps >= obj.tap.tapsNeeded) return;
          taps++;
          resetIdleHint();
          if (taps < obj.tap.tapsNeeded) {
            playAnim(el, taps === 1 ? 'anim-wobble-sm' : 'anim-wobble-lg');
            Sfx.wobble(taps);
            sparkleBurst(e.clientX, e.clientY, '#fff3b0');
          } else {
            // --- the big POP ---
            pendingTappables = pendingTappables.filter(p => p !== el);
            Sfx.crackPop();
            sparkleBurst(e.clientX, e.clientY, '#ffd94d');
            sparkleBurst(e.clientX + 20, e.clientY - 10, '#ffffff');
            playAnim(el, 'anim-crack', () => { el.style.display = 'none'; });

            const cat = els['caterpillar'];
            setTimeout(() => {
              cat.el.style.opacity = 1;
              playAnim(cat.el, 'anim-hatch', () => {
                cat.el.classList.add('anim-breathe');
              });
              Sfx.boing();
            }, 380);

            // camera pulls back, caption swaps, arrow enables
            setTimeout(() => {
              if (page.cameraAfter) setCamera(page.cameraAfter, false);
              if (page.afterText) narrate(page.afterText, armArrow);
              else armArrow();
              stage.dispatchEvent(new CustomEvent('storyevent', { detail: 'hatched' }));
            }, 1100);
          }
        });
      }
    });

    /* ---- hotspots (tappable regions on the background art) ---- */
    (page.hotspots || []).forEach(h => {
      const z = document.createElement('div');
      z.className = 'hotspot';
      Object.assign(z.style, h.rect);
      sprites.appendChild(z);
      z.addEventListener('pointerdown', (e) => {
        if (h.tap.effect === 'glow') glowAt(h.rect);
        if (h.tap.sound && Sfx[h.tap.sound]) Sfx[h.tap.sound]();
        sparkleBurst(e.clientX, e.clientY, h.tap.sparkColor);
        resetIdleHint();
      });
    });

    /* ---- narration + arrow condition ---- */
    const arrow = page.arrow || { when: 'narration' };
    narrate(page.text, () => {
      if (arrow.when === 'narration') armArrow();
    });
    resetIdleHint();
  }

  /* ================= Navigation ================= */

  function turnTo(idx) {
    stopNarration();
    Sfx.whoosh();
    turner.classList.remove('turning');
    void turner.offsetWidth;
    turner.classList.add('turning');

    world.classList.add('world-out');
    caption.classList.add('hidden');
    setTimeout(() => {
      world.classList.remove('world-out');
      world.classList.add('world-in');
      loadPage(idx);
      setTimeout(() => world.classList.remove('world-in'), 700);
    }, 430);
  }

  arrowBtn.addEventListener('click', () => {
    if (arrowBtn.disabled) return;
    Sfx.tap();
    const next = pageIndex + 1;
    if (next < STORY.pages.length) {
      turnTo(next);
    } else {
      // Last page of this batch: gentle loop back to the splash for now.
      stopNarration();
      splash.classList.remove('gone');
      caption.classList.add('hidden');
      arrowBtn.classList.add('hidden');
      pageIndex = -1;
    }
  });

  /* ================= Splash ================= */

  beginBtn.addEventListener('pointerdown', () => {
    Sfx.unlock();
    Sfx.tap();
  });
  beginBtn.addEventListener('click', () => {
    splash.classList.add('gone');
    setTimeout(() => turnTo(0), 250);
  });

  // audio unlock on any first touch
  window.addEventListener('pointerdown', () => Sfx.unlock(), { once: true });

  /* ================= Service worker ================= */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () =>
      navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();


</script>
</body>
</html>
